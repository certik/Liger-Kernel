[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-lite"
version = "0.1.0"
description = "PyTorch-lite: lightweight shims for torch, transformers, and tokenizers for macOS/CPU development"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["torch*", "transformers*", "tokenizers*"]
namespaces = false
