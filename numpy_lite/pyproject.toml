[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-lite"
version = "0.1.0"
description = "numpy-lite: fast-loading NumPy replacement backed by a single C extension"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["numpy*"]
namespaces = false


