[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triton"
version = "3.6.0"
description = "Triton-lite: a pure-Python Triton shim for macOS/CPU development"
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["triton*"]
namespaces = false
